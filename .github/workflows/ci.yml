name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: "1"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1"
      - name: Install dependencies
        run: uv sync
      # The same hooks as `git commit`, on every file. Catches commits made with
      # --no-verify or from a clone without `pre-commit install`.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Lint
        run: just lint
      - name: Test
        run: just test
      - name: Start Postgres
        run: just up
      - name: Migration check
        run: just migration-check
