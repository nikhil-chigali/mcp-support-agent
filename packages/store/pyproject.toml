[project]
name = "store"
version = "0.1.0"
description = "Hearth & Kettle store backend: FastAPI over Postgres, enforcing the refund policy (R1–R8) in code"
readme = "README.md"
authors = [
    { name = "Nikhil Chigali", email = "nikhil.chigali@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
